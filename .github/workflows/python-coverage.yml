name: Python Coverage Task_4 Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  python-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test and coverage tools
        run: |
          python -m pip install pytest==8.4.1 coverage==7.9 pytest-cov==6.2.1

      - name: Run tests with coverage
        run: |
          python -m pytest --verbose --cov=src --cov-report=term-missing

      - name: Add coverage report to the pull request
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Enforce minimum coverage
        run: python -m coverage report --fail-under=90
